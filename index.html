<html lang="en">

  <meta charset="utf-8" />
  <title>House of Sunday — Visual Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#D5C6B2" />
  <link rel="icon" type="image/png" href="assets/logos/hos-sun-mark-transparent.png" />
  <link rel="stylesheet" href="colors_and_type.css" />

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--hos-sand); color: var(--hos-ink); }
  body {
    font-family: var(--font-mono); font-size: 14px;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    overscroll-behavior: none;
  }
  img { display: block; max-width: 100%; }

  /* ----- shell ----- */
  .shell {
    max-width: 540px; margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ----- header ----- */
  .head {
    position: sticky; top: 0; z-index: 30;
    background: var(--hos-sand);
    padding: 14px 20px 0;
    padding-top: calc(14px + env(safe-area-inset-top));
  }

  /* Brand row */
  .head__brand {
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 22px;
  }
  .head__brand-mark {
    width: min(275px, 90vw);
    height: auto;
    display: block;
  }
  @media (min-width: 600px) {
    .head__brand-mark {
      width: min(344px, 80vw);
    }
  }

  /* Food / Drinks tabs — primary toggle */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hos-line);
  }
  .tab {
    -webkit-appearance: none; appearance: none;
    cursor: pointer;
    font-family: "Florencesans SC", var(--font-serif); font-weight: 400;
    /* Florencesans always renders uppercase, regardless of the HTML casing. */
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 17px;
    padding: 12px 0;
    border-radius: 2px;
    border: 1px solid var(--hos-ink);
    background: transparent;
    color: var(--hos-ink);
    transition: 140ms ease;
  }
  .tab[aria-selected="true"] {
    background: var(--hos-sun);
    color: var(--hos-salt);
    border-color: var(--hos-sun);
  }

  /* Language toggle — small pill switch, sits above the Food/Drinks tabs */
  .lang-toggle {
    display: flex; justify-content: center;
    gap: 6px;
    padding-bottom: 12px;
  }
  .lang-btn {
    -webkit-appearance: none; appearance: none;
    cursor: pointer;
    font-family: var(--font-mono); font-weight: 400;
    letter-spacing: 0.04em;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--hos-ink);
    background: transparent;
    color: var(--hos-ink);
    transition: 140ms ease;
  }
  .lang-btn[aria-pressed="true"] {
    background: var(--hos-ink);
    color: var(--hos-salt);
    border-color: var(--hos-ink);
  }

  /* Section chips — horizontal scroll */
  .chips {
    display: flex; gap: 8px;
    padding: 14px 20px;
    margin: 0 -20px;                       /* bleed to header edges */
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
    background: transparent;             /* strip sits on the Sand page; no distinct fill */
    border-bottom: 1px solid var(--hos-line);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    -webkit-appearance: none; appearance: none;
    flex: 0 0 auto;
    cursor: pointer;
    background: transparent;
    color: var(--hos-ink);
    border: 1px solid var(--hos-ink);
    border-radius: 2px;
    padding: 7px 14px;
    font-family: var(--font-serif); font-weight: 400;
    letter-spacing: -0.005em;
    font-size: 15px;
    transition: 120ms ease;
    white-space: nowrap;
  }
  .chip[aria-current="true"] {
    background: var(--hos-ink);
    color: var(--hos-salt);
    border-color: var(--hos-ink);
  }

  /* ----- grid ----- */
  .panel { padding: 28px 20px 80px; }
  .panel[hidden] { display: none; }

  .section + .section { margin-top: 64px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin: 0 0 18px;
  }
  .section-head__title {
    font-family: var(--font-serif); font-size: 32px; line-height: 1;
    letter-spacing: -0.015em; color: var(--hos-ink); margin: 0;
  }
  .section-head__count {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--hos-ink); letter-spacing: 0.06em;
  }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 18px 12px;
  }
  .item {
    display: flex; flex-direction: column; gap: 10px;
    margin: 0;
  }

  /* Photo is now its own button — only the photo opens the lightbox. */
  .item__photo-btn {
    -webkit-appearance: none; appearance: none;
    background: transparent; border: 0; padding: 0; margin: 0;
    display: block; width: 100%;
    cursor: pointer;
    font: inherit; color: inherit; text-align: left;
    transition: transform 200ms ease;
  }
  .item__photo-btn:active { transform: scale(0.985); }
  .item__photo-btn:focus-visible {
    outline: 2px solid var(--hos-sun);
    outline-offset: 2px;
  }
  .item__photo {
    aspect-ratio: 4 / 5;
    background: var(--hos-sand);
    overflow: hidden;
    position: relative;
  }
  .item__photo img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .item__photo--placeholder {
    display: flex; align-items: center; justify-content: center;
    background: var(--hos-sand);
  }
  .item__photo--placeholder svg {
    width: 28%; height: 28%; color: var(--hos-sun); opacity: 0.45;
  }
  .item__name {
    font-family: var(--font-sans); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 11.5px; line-height: 1.3; color: var(--hos-ink);
    margin: 0;
    /* Reserve two lines so the Ingredients pill below aligns across rows.
       2 × line-height (1.3em) = 2.6em. min- not fixed, so 3+ line names
       (none today, but future-proof) still grow naturally. */
    min-height: 2.6em;
  }

  /* Native <details> ingredients collapse */
  .item__details { margin: 0; }
  /* Belt-and-braces: make sure the description stays hidden when collapsed,
     even in browsers whose UA stylesheet for <details> is non-standard. */
  .item__details:not([open]) > :not(summary) { display: none; }
  .item__toggle {
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start;
    padding: 4px 10px;
    background: transparent;
    color: var(--hos-ink);
    border: 1px solid var(--hos-ink);
    border-radius: 2px;
    font-family: var(--font-serif); font-weight: 400;
    letter-spacing: -0.005em;
    font-size: 13px; line-height: 1.1;
    cursor: pointer;
    user-select: none;
    list-style: none;                /* hide default disclosure triangle */
    transition: background 140ms ease, color 140ms ease;
  }
  .item__toggle::-webkit-details-marker { display: none; }
  .item__toggle::marker { content: ''; }
  .item__toggle:focus-visible {
    outline: 2px solid var(--hos-sun);
    outline-offset: 2px;
  }
  .item__chevron {
    display: inline-block; line-height: 1;
    transform: rotate(0deg);
    transition: transform 180ms ease;
  }
  .item__details[open] .item__toggle {
    background: var(--hos-ink);
    color: var(--hos-salt);
  }
  .item__details[open] .item__chevron {
    transform: rotate(180deg);
  }
  .item__desc {
    font-family: var(--font-mono); font-size: 11px; line-height: 1.5;
    color: var(--hos-ink);
    margin: 8px 0 0;
  }
  .item__tag {
    font-family: var(--font-script); font-size: 22px;
    color: var(--hos-sun); line-height: 1; margin-top: 4px;
  }

  /* ----- CJK/Hangul legibility ----- */
  /* zh/ja/ko render in system fallback fonts (the brand fonts have no CJK
     or Hangul glyphs — measured) that look thinner and smaller than the
     Latin faces at the same declared size. Bump the small body copy so it
     reads as visually equivalent. Scoped via :lang() — the <html> lang
     attribute follows the language toggle, so en/ru/id are untouched. */
  :lang(zh) .item__desc,
  :lang(ja) .item__desc,
  :lang(ko) .item__desc,
  :lang(zh) .byo-card__support,
  :lang(ja) .byo-card__support,
  :lang(ko) .byo-card__support {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.7;
  }
  :lang(zh) .section-head__count,
  :lang(ja) .section-head__count,
  :lang(ko) .section-head__count {
    font-size: 12px;
    font-weight: 600;
  }
  :lang(zh) .item__toggle,
  :lang(ja) .item__toggle,
  :lang(ko) .item__toggle {
    font-size: 14px;
    /* 600, not 500: the system CJK/Hangul fallback fonts have no medium cut
       and don't synthesize one — 500 renders identical to 400 (tested). */
    font-weight: 600;
  }
  /* Dish names (card + lightbox): already 700 = real bold in the fallback
     fonts, so only size needs the bump. min-height on the card name is
     em-based, so the two-line alignment reserve scales with it. */
  :lang(zh) .item__name,
  :lang(ja) .item__name,
  :lang(ko) .item__name,
  :lang(zh) .lb__name,
  :lang(ja) .lb__name,
  :lang(ko) .lb__name {
    font-size: 13px;
  }
  /* Tag ("Only on Saturdays"): the script font has no Cyrillic, CJK, or
     Hangul glyphs, so zh/ru/ja/ko fall through to plain system fonts — and
     22px is sized for the script face's decorative look, reading oversized
     as plain text. Render it as a small accent label instead. en/id keep
     the real script font and are untouched. */
  :lang(zh) .item__tag,
  :lang(ru) .item__tag,
  :lang(ja) .item__tag,
  :lang(ko) .item__tag {
    font-size: 13px;
    font-weight: 600;
  }

  /* ----- lightbox ----- */
  /* Flex column so the header sits directly above the centered photo
     as one tight unit, instead of floating at the viewport edge. */
  .lb {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0, 0, 0, 0.6);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .lb.is-open { display: flex; }

  .lb__img {
    display: block;
    max-width: 90vw;
    /* Leaves room above for the ~44px header row + the 8px gap */
    max-height: calc(85vh - 52px);
    width: auto; height: auto;
    object-fit: contain;
  }

  /* Header row sits right above the photo. width matches the photo's
     max-width so name and × land at the photo's left/right edges.
     pointer-events: none lets taps on empty space in the row pass
     through to the scrim (which closes the lightbox); the name and
     button re-enable their own pointer events. */
  .lb__header {
    width: 90vw;
    max-width: 90vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 4px;
    pointer-events: none;
  }

  /* Dish name — matches .item__name typography exactly (Satoshi caps),
     in Salt so it reads against any photo, with a subtle dark shadow. */
  .lb__name {
    font-family: var(--font-sans); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 11.5px; line-height: 1.3;
    color: var(--hos-salt);
    margin: 0;
    /* Leave room for the 44px close button + padding on the right */
    max-width: calc(100% - 60px);
    pointer-events: auto;
  }

  /* Minimal close button pinned to the viewport top-right —
     independent of where the dish-name header sits. */
  .lb__close {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 8px);
    right: calc(env(safe-area-inset-right) + 8px);
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    color: var(--hos-salt);
    border: 0;
    border-radius: 0;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 32px; font-weight: 300; line-height: 1;
    padding: 0;
    z-index: 2;
    transition: opacity 120ms ease, transform 80ms ease;
  }
  .lb__close:hover  { opacity: 0.75; }
  .lb__close:active { transform: scale(0.92); }
  .lb__close:focus-visible {
    outline: 2px solid var(--hos-salt);
    outline-offset: 2px;
  }

  /* Description + tag remain hidden in the lightbox view. */
  .lb__body { display: none; }

  /* ----- end-of-menu cards (BYO + review) ----- */
  /* Bordered cards linking out from the end of the menu; .byo-card is the
     shared card component for both. The CTA inside reuses .tab wholesale
     for the Food/Drinks tab typography; .tab--card-cta only adds what .tab
     cannot give a block link: the Sun fill (on real tabs it comes from
     [aria-selected="true"], which is invalid ARIA on a link) and block
     geometry. */
  .byo-card {
    display: block;
    margin: 0 20px 16px;                 /* panel padding-bottom (80px) provides the gap above */
    border: 1px solid var(--hos-ink); border-radius: 2px;
    padding: 22px 20px 24px;
    text-align: center;
    text-decoration: none; color: var(--hos-ink);
  }
  .byo-card--last { margin-bottom: 60px; }  /* the last card carries the gap to the footer */
  .byo-card__title {
    /* Base size is the SECOND-and-later-lines size; ::first-line below bumps
       the lead line up. One field, one content newline, so a translator still
       breaks wherever their language needs (their first line leads), or not
       at all (a single-line title renders entirely at the lead size). */
    font-family: var(--font-serif); font-size: 20px; line-height: 1.2;
    letter-spacing: -0.015em;
    margin: 0 0 10px;
    /* Line breaks come from the Sanity content, one field per language —
       never a <br> in markup, so each translation breaks where it needs to. */
    white-space: pre-line;
  }
  .byo-card__title::first-line {
    font-size: 26px;
  }
  .byo-card__support {
    font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
    margin: 0 0 16px;
    white-space: pre-line;
  }
  .tab--card-cta {
    display: block; width: 100%;
    text-align: center; text-decoration: none;
    background: var(--hos-sun);
    color: var(--hos-salt);
    border-color: var(--hos-sun);
  }
  .byo-card:hover .tab--card-cta { opacity: 0.9; }
  .byo-card:focus-visible {
    outline: 2px solid var(--hos-sun);
    outline-offset: 2px;
  }
  /* Florencesans SC has no U+2197 glyph; render the arrow in Satoshi. */
  .byo-card__arrow {
    font-family: var(--font-sans); font-size: 13px;
    vertical-align: 2px; margin-left: 7px;
  }

  /* ----- footer ----- */
  .foot {
    text-align: center; padding: 40px 20px 60px;
    border-top: 1px solid var(--hos-line);
    margin-top: 20px;
  }
  .foot__script {
    font-family: var(--font-script);
    color: var(--hos-sun);
    font-size: 24px; line-height: 1.1;
  }
  .foot__meta {
    margin-top: 12px;
    font-family: var(--font-mono); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--hos-ink);
    white-space: nowrap;
  }

  /* ----- visitor mode (?src=) ----- */
  /* Arrivals from Google Ads sitelinks / the Instagram bio carry ?src=; the
     table QR does not. Visitor mode hides the review card and adds a sticky
     Location + Book / Order bar. JS sets body.is-visitor and un-hides the
     bar; table mode never sees any of this. */
  .byo-card[hidden] { display: none; }
  /* Bar height is 2 × --space-3 + a 44px tab row + the safe-area inset;
     --space-9 is the smallest spacing token that clears it. */
  body.is-visitor .shell {
    padding-bottom: calc(var(--space-9) + env(safe-area-inset-bottom));
  }

  /* Type sizes below are px, like the rest of this page: colors_and_type.css
     sets html { font-size: var(--fs-14) }, so the rem-based --fs-* tokens
     render at 87.5% here (--fs-13 would be 11.4px). Values match the token
     names and the main site's drawer (13px rows). */
  .visit-bar {
    position: fixed; z-index: 40;
    left: 0; right: 0; bottom: 0;
    max-width: 540px; margin: 0 auto;       /* same column as .shell */
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-2);
    padding: var(--space-3) var(--space-4);
    padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
    background: var(--hos-sand);
    border-top: 1px solid var(--hos-line);
  }
  .visit-bar[hidden] { display: none; }
  /* Buttons reuse .tab wholesale (size, tracking, uppercase, ink border,
     transparent fill = the inactive tab), so they stay identical to the
     Food / Drinks tabs if those ever change. line-height: normal because
     the Location <a> would otherwise inherit the body's line-height (a
     <button> does not), which makes it taller than the tabs. */
  .visit-bar__btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    min-height: 44px;                       /* the Food / Drinks tab height */
    padding-left: var(--space-3); padding-right: var(--space-3);
    font-family: var(--font-display); line-height: normal;
    border-radius: var(--radius-xs);
    text-decoration: none;
    white-space: nowrap;
  }
  /* Below 428px wide (iPhone Pro Max width) "BOOK / ORDER" no longer fits
     at the tab size inside --space-3 side padding (16px does not fit at
     375px either, even untracked), so both labels step down to 14px with
     --tr-wide tracking. Fits down to 360px-wide phones. */
  @media (max-width: 427px) {
    .visit-bar__btn {
      font-size: 14px;                    /* px, see the type note above .visit-bar */
      letter-spacing: var(--tr-wide);
    }
  }
  .visit-bar__btn--primary {
    background: var(--hos-ink);
    color: var(--hos-salt);
  }
  .visit-bar__btn:focus-visible {
    outline: 2px solid var(--hos-ink);
    outline-offset: 2px;
  }

  /* Book / Order drawer: bottom sheet over a dimmed page. */
  .sheet {
    position: fixed; inset: 0; z-index: 900;   /* above the bar, below the lightbox */
    background: color-mix(in srgb, var(--hos-ink) 35%, transparent);
    cursor: pointer;
  }
  .sheet[hidden] { display: none; }
  .sheet__panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 540px; margin: 0 auto;
    background: var(--hos-sand);
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    padding: var(--space-5) var(--space-4);
    padding-bottom: calc(var(--space-5) + env(safe-area-inset-bottom));
    cursor: auto;
    outline: none;
  }
  .sheet__head {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }
  .sheet__title {
    font-family: var(--font-display); font-weight: 400;
    text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 18px; line-height: 1;
    color: var(--hos-ink);
    margin: 0;
  }
  .sheet__close {
    -webkit-appearance: none; appearance: none;
    background: transparent; border: 0; padding: 0;
    cursor: pointer;
    font-family: var(--font-sans); font-size: 24px; line-height: 1;
    color: var(--hos-ink);
  }
  /* Rows match the main site drawer's text links: Florencesans, uppercase,
     13px, 0.05em tracking, line-height 1, all in Ink. Left-aligned here. */
  .sheet__list {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: var(--space-2);
  }
  .sheet__row {
    display: block;
    padding: var(--space-2) 0;
    font-family: var(--font-display); font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.05em;
    line-height: 1;
    color: var(--hos-ink); text-decoration: none;
  }
  .sheet__row:visited { color: var(--hos-ink); }
  .sheet__row:focus-visible,
  .sheet__close:focus-visible {
    outline: 2px solid var(--hos-ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KCHMXQ6S"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

<div class="shell">

  <!-- ============= HEADER ============= -->
  <header class="head">
    <!-- Brand row -->
    <div class="head__brand">
      <img class="head__brand-mark" src="assets/logos/hos-logo-horizontal.svg" alt="House of Sunday" />
    </div>

    <!-- Language toggle — one pill per language; JS keys off data-lang -->
    <div class="lang-toggle" role="group" aria-label="Language">
      <button class="lang-btn" type="button" data-lang="en" aria-pressed="true">EN</button>
      <button class="lang-btn" type="button" data-lang="zh" aria-pressed="false">中文</button>
      <button class="lang-btn" type="button" data-lang="ru" aria-pressed="false">RU</button>
      <button class="lang-btn" type="button" data-lang="id" aria-pressed="false">ID</button>
      <button class="lang-btn" type="button" data-lang="ja" aria-pressed="false">日本語</button>
      <button class="lang-btn" type="button" data-lang="ko" aria-pressed="false">한국어</button>
    </div>

    <!-- Food / Drinks tabs -->
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  data-tab="food">Food</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="drinks">Drinks</button>
    </div>

    <!-- Section chips -->
    <nav class="chips" id="chips" aria-label="Sections"></nav>
  </header>

  <!-- ============= PANELS ============= -->
  <main>
    <section class="panel" id="panel-food" role="tabpanel"></section>
    <section class="panel" id="panel-drinks" role="tabpanel" hidden></section>
  </main>

  <!-- End-of-menu Build Your Own card. Sits OUTSIDE the panels so it renders
       once and stays visible under both tabs. Text is filled by
       renderByoCard() from the byo* labels (re-renders on language switch).
       The canonical destination is the Sanity byoUrl field (applied by
       applyCardUrls()); the href below is a deliberate FALLBACK behind that
       working Sanity read, not a centralisation violation — it only surfaces
       if the field is empty or the generated data predates it. -->
  <a class="byo-card" id="byoCard"
     href="https://www.house-of-sunday.com/menu?tab=byo"
     target="_blank" rel="noopener">
    <h2 class="byo-card__title" id="byoCardTitle"></h2>
    <p class="byo-card__support" id="byoCardSupport"></p>
    <span class="tab tab--card-cta"><span id="byoCardCta"></span><span class="byo-card__arrow" aria-hidden="true">&#8599;</span></span>
  </a>

  <!-- Review-invitation card, same mechanism as the BYO card above. Text is
       filled by renderReviewCard() from the review* labels. The canonical
       destination is the Sanity reviewUrl field (applied by applyCardUrls());
       the href below is a deliberate FALLBACK behind that working Sanity
       read, not a centralisation violation. It matches the owner's standard
       review link (g.page, opens in the Maps app); keep it equal to the
       Sanity value. -->
  <a class="byo-card byo-card--last" id="reviewCard"
     href="https://g.page/r/CdEIFKddGm8bEAI/review"
     target="_blank" rel="noopener">
    <h2 class="byo-card__title" id="reviewCardTitle"></h2>
    <p class="byo-card__support" id="reviewCardSupport"></p>
    <span class="tab tab--card-cta"><span id="reviewCardCta"></span><span class="byo-card__arrow" aria-hidden="true">&#8599;</span></span>
  </a>

  <footer class="foot">
    <div class="foot__script">Sundays are better than others.</div>
    <div class="foot__meta">House of Sunday · Made slowly in Canggu</div>
  </footer>
</div>

<!-- ============= VISITOR MODE (?src=) ============= -->
<!-- Hidden in table mode; visitor-mode JS un-hides the bar. Same pair as the
     main site footer: Location + Book / Order. Labels are English in every
     language for now. -->
<div class="visit-bar" id="visitBar" hidden>
  <!-- href is set from LOCATION_URL in visual-menu.js (the Google profile,
       never a route). -->
  <a class="tab visit-bar__btn" id="visitLocation"
     target="_blank" rel="noopener noreferrer">Location</a>
  <button class="tab visit-bar__btn visit-bar__btn--primary" id="visitBook"
          type="button" aria-haspopup="dialog" aria-controls="bookSheet">Book / Order</button>
</div>

<!-- Book / Order drawer. Rows are rendered by renderOrderLinks() from
     ORDER_LINKS in visual-menu.js (port of the main site's buildOrderLinks). -->
<div class="sheet" id="bookSheet" hidden>
  <div class="sheet__panel" id="bookSheetPanel" role="dialog" aria-modal="true"
       aria-labelledby="bookSheetTitle" tabindex="-1">
    <div class="sheet__head">
      <h2 class="sheet__title" id="bookSheetTitle">Book or order</h2>
      <button class="sheet__close" id="bookSheetClose" type="button" aria-label="Close">&times;</button>
    </div>
    <ul class="sheet__list" id="bookSheetList"></ul>
  </div>
</div>

<!-- ============= LIGHTBOX ============= -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbName" tabindex="-1">
  <button class="lb__close" id="lbClose" type="button" aria-label="Close image">&times;</button>
  <div class="lb__header">
    <h3 class="lb__name" id="lbName"></h3>
  </div>
  <img class="lb__img" id="lbImg" alt="" />
  <div class="lb__body" id="lbBody">
    <p class="lb__desc" id="lbDesc"></p>
    <div class="lb__tag" id="lbTag" hidden></div>
  </div>
</div>

<script src="menu-data.generated.js"></script>
<script src="visual-menu.js"></script>
</body>
</html>
